[build]
  base = "apps/web"
  command = "cd ../.. && corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @warfire/shared build && cd apps/web && npm run build"
  publish = ".next"

[build.environment]
  NEXT_PUBLIC_API_URL = "http://localhost:3001"
  NEXT_PUBLIC_WS_URL = "http://localhost:3001"
